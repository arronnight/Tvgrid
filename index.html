<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tvgrid — Live TV</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">TVGRID <span class="badge">LIVE</span></div>
    <div class="now-playing" id="nowPlaying">—</div>
    <div class="controls">
      <button id="eraBtn" type="button" title="Switch between 90s and 2000s TV">Era: 90s</button>
      <button id="fxBtn" class="on" type="button" title="Toggle CRT scanlines and chromatic aberration">CRT: On</button>
      <button id="tubeBtn" class="on" type="button" title="Toggle rounded CRT tube corners">Tube: On</button>
      <button id="premiumBtn" class="on" type="button">Premium: On</button>
      <button id="epgToggle" type="button">EPG</button>
      <button id="geoBtn" type="button">Detect Location</button>
    </div>
  </header>
  <main class="main">
    <aside class="sidebar">
      <input id="search" type="search" placeholder="Search channels…">
      <div class="groups" id="groups"></div>
      <ul class="channel-list" id="channelList"></ul>
    </aside>
    <section class="player-area">
      <div class="player-frame" id="playerMount">
        <div class="player-overlay" id="playerOverlay">Select a channel</div>
      </div>
      <div class="meta">
        <h2 id="channelTitle">—</h2>
        <p id="channelDesc">—</p>
        <a id="openTab" href="#" target="_blank" rel="noopener">Open source page</a>
      </div>
    </section>
    <aside class="epg" id="epgPanel" aria-label="TV guide">
      <div class="guide-banner">
        <div class="guide-logo" aria-hidden="true"><span>TV</span><b>GUIDE</b></div>
        <div class="guide-banner-copy">
          <div class="epg-kicker" id="guideKicker">TV GUIDE</div>
          <h3 id="guideTitle">TONIGHT'S LINEUP</h3>
          <div class="guide-banner-sub" id="guideNowPlaying">Select a channel to see what's on</div>
        </div>
        <div class="guide-banner-side">
          <div class="epg-clock" id="guideClock">—</div>
          <button id="guideClose" class="guide-close" type="button" aria-label="Close guide">Close</button>
        </div>
      </div>
      <div class="guide-timebar" id="guideTimebar"></div>
      <div class="epg-grid" id="epgGrid"></div>
    </aside>
  </main>
</div>
<script src="vendor/flv.min.js"></script>
<script src="vendor/hls.min.js"></script>
<script src="channels.js"></script>
<script src="premium.js"></script>
<script src="app.js"></script>
</body>
</html>
