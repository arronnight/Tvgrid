<!doctype html><html><body>
<video id="v" muted autoplay playsinline controls style="width:640px;background:#000"></video>
<script src="vendor/hls.min.js"></script>
<script>
const url = new URLSearchParams(location.search).get('url');
const v = document.getElementById('v');
if (Hls.isSupported()) { const h = new Hls(); h.loadSource(url); h.attachMedia(v); h.on(Hls.Events.MANIFEST_PARSED,()=>v.play().catch(e=>console.warn(e))); }
else v.src = url;
window.__status = () => ({ready:v.readyState, t:v.currentTime, err:v.error && v.error.message, src:v.currentSrc});
</script></body></html>
