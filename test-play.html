<!doctype html><html><body>
<video id="v" muted autoplay playsinline controls style="width:640px;background:#000"></video>
<script src="vendor/flv.min.js"></script>
<script>
const ch = new URLSearchParams(location.search).get('ch') || 'nickpicks';
const url = 'https://stream-cdn-iad3.vaughnsoft.net/play/live_' + ch + '.flv';
const v = document.getElementById('v');
const p = flvjs.createPlayer({type:'flv',url,isLive:true,hasAudio:true,hasVideo:true});
p.attachMediaElement(v); p.load(); p.play().catch(e=>console.warn('play',e));
window.__status = () => ({ready:v.readyState, t:v.currentTime, err:v.error && v.error.message});
</script></body></html>
